<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>白豆工具箱</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: #0a0a0a;
  color: #e5e5e5;
  min-height: 100dvh;
  padding: 0 20px 40px;
  -webkit-tap-highlight-color: transparent;
}
.header {
  padding: 48px 0 32px;
  text-align: center;
}
.header h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.header p {
  font-size: 13px;
  color: #888;
  margin-top: 6px;
}
.section {
  margin-bottom: 28px;
}
.section-title {
  font-size: 12px;
  font-weight: 500;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  padding-left: 4px;
}
.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  margin-bottom: 10px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  text-decoration: none;
  color: #e5e5e5;
  transition: background 0.15s, transform 0.1s;
  -webkit-user-select: none;
  user-select: none;
}
.link-btn:active {
  background: #252525;
  transform: scale(0.98);
}
.link-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.link-text h3 {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.3;
}
.link-text p {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}
.link-arrow {
  margin-left: auto;
  color: #555;
  font-size: 18px;
}
.dbl-btn {
  width: 100%;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.dbl-btn .dots-icon {
  display: flex;
  background: #2a2a2a;
  gap: 6px;
}
.dots-icon span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #888;
}
.dbl-btn.armed {
  border-color: #4a4a4a;
  background: #222;
}
.dbl-btn.armed .dots-icon span {
  background: #e5e5e5;
}
.dbl-btn.armed .hint-idle,
.dbl-btn .hint-ready {
  display: none;
}
.dbl-btn.armed .hint-ready {
  display: block;
}
.footer {
  text-align: center;
  padding: 20px 0;
  font-size: 11px;
  color: #444;
}
</style>
</head>
<body>

<div class="header">
  <h1>白豆工具箱</h1>
  <p>常用链接 · 快速直达</p>
</div>

<div class="section">
  <div class="section-title">录入</div>

  <a class="link-btn" href="https://my.feishu.cn/share/base/form/shrcnxYzpLYe4gDKrn9eFpRvgVg" target="_blank" rel="noopener">
    <div class="link-icon" style="background:#1a3a5c;">📋</div>
    <div class="link-text">
      <h3>关系网录入</h3>
      <p>飞书表单 · 记录人脉信息</p>
    </div>
    <span class="link-arrow">›</span>
  </a>

  <a class="link-btn" href="https://my.feishu.cn/share/base/form/shrcnPy8UArSTXBFADXpw1qbf3e" target="_blank" rel="noopener">
    <div class="link-icon" style="background:#3a2a1a;">🎙️</div>
    <div class="link-text">
      <h3>记录见面</h3>
      <p>飞书表单 · 见面 brain dump</p>
    </div>
    <span class="link-arrow">›</span>
  </a>

  <button type="button" class="link-btn dbl-btn" data-dbl-open="https://my.feishu.cn/base/Ocwzb6rVdainrZsrHSZc8KO8nIh?table=tbl3UTgJcti81jHS&view=vewfbYvOlV" aria-label="见面结果，双击打开">
    <div class="link-icon dots-icon" aria-hidden="true"><span></span><span></span></div>
    <div class="link-text">
      <h3>见面结果</h3>
      <p class="hint-idle">双击打开 · 查看已提交记录</p>
      <p class="hint-ready">再点一次打开</p>
    </div>
    <span class="link-arrow">··</span>
  </button>
</div>

<!--
<div class="section">
  <div class="section-title">工具</div>
</div>
-->

<div class="footer">d.baidou.work</div>

<script>
(function () {
  var gap = 450;
  document.querySelectorAll("[data-dbl-open]").forEach(function (el) {
    var last = 0;
    var timer;
    function arm() {
      el.classList.add("armed");
      clearTimeout(timer);
      timer = setTimeout(function () {
        last = 0;
        el.classList.remove("armed");
      }, gap);
    }
    function openResult() {
      last = 0;
      clearTimeout(timer);
      el.classList.remove("armed");
      window.open(el.getAttribute("data-dbl-open"), "_blank", "noopener");
    }
    el.addEventListener("click", function (e) {
      e.preventDefault();
      var now = Date.now();
      if (last && now - last < gap) {
        openResult();
      } else {
        last = now;
        arm();
      }
    });
  });
})();
</script>

</body>
</html>
