* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  background: #0a0a0a;
  color: #e5e5e5;
  min-height: 100dvh;
  padding: 0 20px 40px;
  -webkit-tap-highlight-color: transparent;
}
.header {
  padding: 48px 0 32px;
  text-align: center;
}
.header h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.header p {
  font-size: 13px;
  color: #888;
  margin-top: 6px;
}
.section {
  margin-bottom: 28px;
}
.section-title {
  font-size: 12px;
  font-weight: 500;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
  padding-left: 4px;
}
.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  margin-bottom: 10px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  text-decoration: none;
  color: #e5e5e5;
  transition: background 0.15s, transform 0.1s;
  -webkit-user-select: none;
  user-select: none;
}
.link-btn:active {
  background: #252525;
  transform: scale(0.98);
}
.link-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.link-text h3 {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.3;
}
.link-text p {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}
.link-arrow {
  margin-left: auto;
  color: #555;
  font-size: 18px;
}
.footer {
  text-align: center;
  padding: 20px 0;
  font-size: 11px;
  color: #444;
}
</style>
</head>
