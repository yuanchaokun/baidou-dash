<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>白豆自我调查 · 没有调查就没有发言权</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>白豆自我调查</h1>
      <p>没有调查就没有发言权</p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-history" title="历史记录">📁</button>
      <button class="icon-btn" id="btn-settings" title="设置">⚙︎</button>
    </div>
  </div>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <nav class="chips" id="chips"></nav>
</header>

<main id="main" class="main"></main>

<footer class="bottom">
  <div class="bottom-inner">
    <div class="status" id="status">草稿会自动保存在这台设备上</div>
    <div class="bottom-btns">
      <button class="btn ghost" id="btn-prev">上一部分</button>
      <button class="btn primary" id="btn-next">下一部分</button>
    </div>
  </div>
</footer>

<dialog id="dlg-settings" class="dlg">
  <form method="dialog">
    <h2>设置</h2>
    <label class="field">
      <span>访问码</span>
      <input type="password" id="inp-code" autocomplete="off" placeholder="提交到后台、查看历史时需要">
    </label>
    <p class="hint" id="code-status">尚未验证</p>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" id="btn-clear-draft">清空本地草稿</button>
      <span class="spacer"></span>
      <button class="btn ghost" value="cancel">取消</button>
      <button class="btn primary" type="button" id="btn-save-code">保存并验证</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-history" class="dlg">
  <h2>历史记录</h2>
  <div id="history-list" class="history-list"><p class="hint">加载中…</p></div>
  <div class="dlg-actions">
    <span class="spacer"></span>
    <button class="btn ghost" id="btn-close-history">关闭</button>
  </div>
</dialog>

<script src="/questions.js"></script>
<script src="/app.js"></script>
</body>
</html>
